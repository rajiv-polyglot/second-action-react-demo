name: Deploy Project
on: [push, workflow_dispatch]
jobs:
    test: # Job 1
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            - name: Install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run Tests
              run: npm test
    deploy: # job 2
       needs: [test]         
       runs-on: ubuntu-latest
       steps:
          - name: Get Code
            uses: actions/checkout@v3
          - name: Install NodeJS
            uses: actions/setup-node@v3
            with:
              node-version: 18
          - name: Install dependencies
            run: npm ci
          - name: Build project
            run: npm run build
          - name: Deploy
            run: echo "Deploying..."